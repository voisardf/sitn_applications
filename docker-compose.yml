services:
  apps:
    image: ${DOCKER_BASE}
    build:
      context: .
      args:
        ENV_FILE: ${ENV_FILE}
    env_file: ${ENV_FILE}
    command: "./startup.sh"
    restart: unless-stopped
    ports:
      - "${DOCKER_PORT}:8000"
    networks:
      - default
      - sitn_pdf
    volumes:
      - ${UPLOAD_DATA_PATH}:/upload:rw
      - ${DATA_PATH}:/data:ro

  # sene_chantiers photo sanitisation and deadline digest. Same image as
  # apps, different command. This is the only service with /data mounted
  # read-write, so request-handling code stays structurally unable to
  # write there.
  sene_chantiers_worker:
    image: ${DOCKER_BASE}
    depends_on:
      - apps
    env_file: ${ENV_FILE}
    command: >
      sh -c ". venv/bin/activate &&
             python manage.py process_photo_uploads --loop"
    restart: unless-stopped
    volumes:
      - ${UPLOAD_DATA_PATH}:/upload:rw
      - ${DATA_PATH}:/data:rw

# Shared with the WeasyPrint container that renders the sene_chantiers
# PDFs, which lives outside this compose project.
#
# It has to be external: `deploy` runs `docker compose down -v`, which
# would delete a compose-managed network and silently strip WeasyPrint of
# its route on every deploy. An external network is not compose's to
# remove, so the link survives.
#
# Reaching the service through the host instead (a published port on the
# Docker host) does not work here: firewalld blocks traffic from the
# bridge networks to host ports, so container-to-host is refused even
# though the port is bound and answers from the host itself.
#
# One-time prerequisite on every Docker host that runs this stack:
#     docker network create sitn_pdf
networks:
  sitn_pdf:
    external: true
